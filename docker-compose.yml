services:
  # 1. PostgreSQL (메인 DB)
  postgres:
    image: postgres:15-alpine
    container_name: quickticket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: quickticket
      POSTGRES_USER: kakaru
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # 2. Redis (대기열 및 분산 락)
  redis:
    image: redis:alpine
    container_name: quickticket-redis
    ports:
      - "6379:6379"

  # 3. Kafka (메시지 브로커 - Apache 공식 이미지, KRaft 모드)
  kafka:
    image: apache/kafka:3.7.0
    container_name: quickticket-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "quickticket-cluster-1"

  # 4. Prometheus (모니터링)
  prometheus:
    image: prom/prometheus:latest
    container_name: quickticket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # 5. Nginx (웹 서버 / 리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: quickticket-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - postgres
      - redis
      - kafka

volumes:
  postgres-data: